<header class="barra">
  <div class="lado">
    <button class="icono" type="button" aria-label="Mostrar u ocultar el menú" (click)="alternar()"><cv-icono nombre="menu" [tamano]="22" /></button>
    <a class="marca" routerLink="/inicio">COMUNIDADES VIRTUALES</a>
  </div>
  <div class="lado">
    <a class="icono campana" routerLink="/notificaciones" aria-label="Notificaciones">
      <cv-icono nombre="campana" [tamano]="20" />
      @if (comunicacion.sinLeer() > 0) { <span class="globo">{{ comunicacion.sinLeer() }}</span> }
    </a>
    <a class="avatar" routerLink="/perfil" [title]="sesion.sesion()?.nombre ?? ''" aria-label="Mi perfil">{{ iniciales() }}</a>
  </div>
</header>

<div class="cuerpo" [class.sin-menu]="!menuAbierto()">
  <aside class="lateral" aria-label="Menú">
    <nav>
      @for (g of menu(); track g.grupo) {
        <p class="grupo">{{ g.grupo }}</p>
        @for (o of g.opciones; track o.texto) {
          <a class="opcion" [routerLink]="o.ruta" routerLinkActive="activa" [routerLinkActiveOptions]="{ exact: !!o.exacta }" (click)="alElegir()">
            <span class="ico"><cv-icono [nombre]="o.icono" /></span>{{ o.texto }}
          </a>
        }
      }
    </nav>
    <div class="pie">
      <div class="yo">
        <span class="mini">{{ iniciales() }}</span>
        <div><strong>{{ sesion.sesion()?.nombre }}</strong><small>{{ rolTexto() }}</small></div>
      </div>
      <button class="salir" type="button" (click)="sesion.salir()"><cv-icono nombre="salir" /> Cerrar sesión</button>
    </div>
  </aside>
  <main class="contenido">
    <div class="centro"><router-outlet /></div>
  </main>
</div>
